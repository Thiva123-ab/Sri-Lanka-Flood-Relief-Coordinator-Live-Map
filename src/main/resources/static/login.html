<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Flood Relief Sri Lanka</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
      body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
      .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
      .input-field { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
      .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.3); outline: none; }
  </style>
</head>
<body class="relative min-h-screen bg-slate-900 flex items-center justify-center p-4">

<!-- Animated Background Blobs -->
<div class="fixed inset-0 w-full h-full overflow-hidden z-[-1] pointer-events-none">
    <div class="absolute top-1/4 -left-10 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-[blob_7s_infinite]"></div>
    <div class="absolute top-1/3 -right-10 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-[blob_7s_infinite_2s]"></div>
</div>

<div class="w-full max-w-md animate__animated animate__fadeInUp">
  <div class="glass-panel rounded-3xl p-10 shadow-2xl shadow-blue-900/20 relative overflow-hidden">
    <!-- Shimmer line -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-cyan-400 to-blue-500"></div>

    <div class="logo text-center mb-10">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4 animate-[pulse_3s_infinite]">
        <i class="fas fa-water text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h1>
      <p class="text-slate-400">Login to coordinator dashboard</p>
    </div>

    <form id="login-form" class="space-y-6">
      <div class="form-group">
        <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
        <input type="text" id="username" class="input-field w-full rounded-xl px-4 py-3 text-white placeholder-slate-500" placeholder="Enter your username" required>
      </div>

      <div class="form-group relative">
        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
        <input type="password" id="password" class="input-field w-full rounded-xl px-4 py-3 pr-12 text-white placeholder-slate-500" placeholder="Enter your password" required>
        <i class="fas fa-eye toggle-password absolute right-4 top-[38px] text-slate-400 cursor-pointer hover:text-white transition-colors" data-target="password"></i>
      </div>

      <div class="form-group">
        <label for="role" class="block text-sm font-medium text-slate-300 mb-2">Role</label>
        <select id="role" class="input-field w-full rounded-xl px-4 py-3 text-white appearance-none" required>
          <option value="member" class="bg-slate-800">Community Member</option>
          <option value="admin" class="bg-slate-800">System Administrator</option>
        </select>
        <i class="fas fa-chevron-down absolute right-4 mt-[-30px] text-slate-400 pointer-events-none"></i>
      </div>

      <button type="submit" class="w-full py-4 rounded-xl font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 mt-4">
        Login to Dashboard
      </button>
    </form>

    <div class="mt-8 text-center border-t border-white/10 pt-6">
      <p class="text-slate-400">Don't have an account? <a href="register.html" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors">Register here</a></p>
      <p class="mt-4"><a href="index.html" class="text-sm text-slate-500 hover:text-slate-300"><i class="fas fa-arrow-left mr-1"></i> Back to Home</a></p>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/form.js"></script>
</body>
</html>
