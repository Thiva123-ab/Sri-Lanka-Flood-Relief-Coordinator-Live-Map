<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help - Flood Relief Sri Lanka</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(0,0,0,0.05); }
        .input-field { background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.1); color: #1e293b; transition: all 0.3s; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); outline: none; }
        
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 20%; color: #64748b; transition: all 0.3s; } html.dark .nav-btn { color: #cbd5e1; }
        .nav-btn:hover, .nav-btn.active { color: #38bdf8; }
    </style>
<script src="js/theme.js"></script></head>
<body class="relative min-h-screen bg-gradient-to-br from-emerald-50 via-sky-50 to-teal-100 dark:from-indigo-950 dark:via-slate-900 dark:to-indigo-950 pb-20">

<header class="fixed w-full top-0 z-50 bg-white/40 dark:bg-indigo-950/70 dark:backdrop-blur-xl backdrop-blur-md border-b border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="logo flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center">
                <i class="fas fa-water text-slate-900 dark:text-slate-100 text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100 hidden sm:block">Emergency Help</h1>
        </div>
        <div class="user-info flex items-center gap-4">
            <span id="user-role" class="px-3 py-1 rounded-full bg-slate-200/50 border border-slate-300 text-xs font-semibold tracking-wider backdrop-blur-md">Member</span>
            <button id="theme-toggle" class="p-2 mr-3 rounded-full bg-slate-200 dark:bg-indigo-900/50 text-slate-800 dark:text-yellow-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors shadow-inner flex items-center justify-center w-10 h-10 border border-slate-300 dark:border-indigo-400/30"><i class="fas fa-moon"></i></button>
            <button id="logout-btn" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-900 dark:text-slate-100 bg-red-500 hover:bg-red-600 transition-colors">Logout</button>
        </div>
    </div>
</header>

<main class="pt-24 px-4 max-w-4xl mx-auto w-full">
    <div class="animate__animated animate__fadeInUp">

        <div class="mb-10 text-center">
            <a href="help_feed.html" class="inline-flex items-center justify-center gap-3 w-full sm:w-auto px-8 py-4 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-slate-900 dark:text-slate-100 shadow-lg hover:shadow-cyan-500/50 transition-all hover:-translate-y-1">
                <i class="fas fa-list-ul text-xl"></i>
                VIEW ACTIVE HELP REQUESTS
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Help Form -->
            <div class="md:col-span-2 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 rounded-3xl p-8 border-t-4 border-red-500 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-red-500/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <h2 class="text-xl font-bold mb-6 text-slate-900 dark:text-slate-100 flex items-center gap-3">
                    <i class="fas fa-hands-helping text-red-500"></i> Request Assistance
                </h2>
                
                <form id="help-form" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="form-group">
                            <label for="help-name" class="block text-sm text-slate-600 dark:text-slate-400 mb-1">Full Name</label>
                            <input type="text" id="help-name" class="input-field w-full p-3 rounded-xl text-slate-900 dark:text-slate-100" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="help-phone" class="block text-sm text-slate-600 dark:text-slate-400 mb-1">Phone Number</label>
                            <input type="tel" id="help-phone" class="input-field w-full p-3 rounded-xl text-slate-900 dark:text-slate-100" placeholder="Enter your phone number" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="help-location" class="block text-sm text-slate-600 dark:text-slate-400 mb-1">Current Location</label>
                        <input type="text" id="help-location" class="input-field w-full p-3 rounded-xl text-slate-900 dark:text-slate-100" placeholder="Describe your location exactly" required>
                    </div>

                    <div class="form-group">
                        <label for="help-type" class="block text-sm text-slate-600 dark:text-slate-400 mb-1">Type of Help Needed</label>
                        <select id="help-type" class="input-field w-full p-3 rounded-xl text-slate-900 dark:text-slate-100 appearance-none" required>
                            <option value="" class="bg-slate-100">Select type of help</option>
                            <option value="rescue" class="bg-slate-100">Immediate Rescue</option>
                            <option value="food" class="bg-slate-100">Food and Water</option>
                            <option value="medical" class="bg-slate-100">Medical Assistance</option>
                            <option value="shelter" class="bg-slate-100">Temporary Shelter</option>
                            <option value="other" class="bg-slate-100">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="help-description" class="block text-sm text-slate-600 dark:text-slate-400 mb-1">Situation Description</label>
                        <textarea id="help-description" rows="4" class="input-field w-full p-3 rounded-xl text-slate-900 dark:text-slate-100" placeholder="Describe your situation in detail..." required></textarea>
                    </div>

                    <div class="form-group bg-red-500/10 border border-red-500/30 p-4 rounded-xl flex items-center gap-3 cursor-pointer" onclick="document.getElementById('help-urgent').click()">
                        <input type="checkbox" id="help-urgent" class="w-5 h-5 accent-red-500 cursor-pointer">
                        <label for="help-urgent" class="cursor-pointer font-bold text-red-400 select-none">Mark as URGENT (Life-threatening)</label>
                    </div>

                    <button type="submit" class="w-full py-4 mt-4 rounded-xl font-bold bg-red-600 hover:bg-red-500 transition-colors text-slate-900 dark:text-slate-100 shadow-lg shadow-red-500/30 text-lg">Send Help Request</button>
                </form>
            </div>

            <!-- Emergency Contacts -->
            <div class="md:col-span-1 space-y-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-slate-100 mb-4 border-b border-slate-200 pb-2">Hotlines</h3>
                
                <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 p-6 rounded-3xl flex items-center gap-5 hover:bg-slate-100/50 transition-colors border-l-4 border-emerald-500">
                    <div class="w-14 h-14 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl"><i class="fas fa-ambulance"></i></div>
                    <div>
                        <p class="text-slate-600 dark:text-slate-400 text-sm font-medium uppercase tracking-wide">Ambulance</p>
                        <p class="text-xl font-bold text-slate-900 dark:text-slate-100 tracking-widest">1990</p>
                    </div>
                </div>

                <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 p-6 rounded-3xl flex items-center gap-5 hover:bg-slate-100/50 transition-colors border-l-4 border-rose-500">
                    <div class="w-14 h-14 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl"><i class="fas fa-fire-extinguisher"></i></div>
                    <div>
                        <p class="text-slate-600 dark:text-slate-400 text-sm font-medium uppercase tracking-wide">Fire & Rescue</p>
                        <p class="text-xl font-bold text-slate-900 dark:text-slate-100 tracking-widest">110</p>
                    </div>
                </div>

                <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 p-6 rounded-3xl flex items-center gap-5 hover:bg-slate-100/50 transition-colors border-l-4 border-blue-500">
                    <div class="w-14 h-14 rounded-full bg-blue-200/20 text-blue-400 flex items-center justify-center text-xl"><i class="fas fa-phone"></i></div>
                    <div>
                        <p class="text-slate-600 dark:text-slate-400 text-sm font-medium uppercase tracking-wide">Police</p>
                        <p class="text-xl font-bold text-slate-900 dark:text-slate-100 tracking-widest">119</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<nav class="fixed bottom-0 w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 border-t border-slate-200 flex sm:hidden z-50">
    <button class="nav-btn py-4" data-tab="map">
      <i class="fas fa-map-marked-alt text-lg mb-1"></i><span class="text-xs">Map</span>
    </button>
    <button class="nav-btn py-4" data-tab="reports">
      <i class="fas fa-exclamation-triangle text-lg mb-1"></i><span class="text-xs">Reports</span>
    </button>
    <button class="nav-btn py-4" data-tab="alerts">
      <i class="fas fa-bell text-lg mb-1"></i><span class="text-xs">Alerts</span>
    </button>
    <button class="nav-btn py-4" onclick="location.href='chat.html'">
      <i class="fas fa-comments text-lg mb-1"></i><span class="text-xs">Chat</span>
    </button>
    <button class="nav-btn active py-4" data-tab="profile">
      <i class="fas fa-user text-lg mb-1"></i><span class="text-xs">Profile</span>
    </button>
</nav>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
