<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Help Requests - Flood Relief Sri Lanka</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(0,0,0,0.05); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 20%; color: #64748b; transition: all 0.3s; } html.dark .nav-btn { color: #cbd5e1; }
        .nav-btn:hover, .nav-btn.active { color: #38bdf8; }
    </style>
<script src="js/theme.js"></script></head>
<body class="relative min-h-screen bg-gradient-to-br from-emerald-50 via-sky-50 to-teal-100 dark:from-indigo-950 dark:via-slate-900 dark:to-indigo-950 pb-20">

<header class="fixed w-full top-0 z-50 bg-white/40 dark:bg-indigo-950/70 dark:backdrop-blur-xl backdrop-blur-md border-b border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="logo flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center">
                <i class="fas fa-water text-slate-900 dark:text-slate-100 text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100 hidden sm:block">Community Help Feed</h1>
        </div>
        <div class="user-info flex items-center gap-4">
            <span id="user-role" class="px-3 py-1 rounded-full bg-slate-200/50 border border-slate-300 text-xs font-semibold tracking-wider backdrop-blur-md">Member</span>
            <button id="theme-toggle" class="p-2 mr-3 rounded-full bg-slate-200 dark:bg-indigo-900/50 text-slate-800 dark:text-yellow-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors shadow-inner flex items-center justify-center w-10 h-10 border border-slate-300 dark:border-indigo-400/30"><i class="fas fa-moon"></i></button>
            <button id="logout-btn" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-900 dark:text-slate-100 bg-red-500 hover:bg-red-600 transition-colors">Logout</button>
        </div>
    </div>
</header>

<main class="pt-24 px-4 max-w-4xl mx-auto w-full">
    <div class="admin-dashboard animate__animated animate__fadeIn">
        
        <div class="flex items-center gap-4 mb-8">
            <a href="help.html" class="w-10 h-10 rounded-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 flex items-center justify-center hover:bg-slate-200/50 transition-colors text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:text-slate-100">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-xl font-bold text-slate-900 dark:text-slate-100">Live Help Requests</h1>
                <p class="text-slate-600 dark:text-slate-400 text-sm">Real-time SOS and assistance requests from the community.</p>
            </div>
        </div>

        <div class="section bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 p-6 rounded-3xl border-t-4 border-blue-500">
            <div class="flex items-center justify-between mb-6 border-b border-slate-200 pb-4">
                <h2 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-list-ul text-blue-400"></i> Active Requests</h2>
                <div class="flex items-center gap-2 text-sm text-emerald-400">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    Live Updates
                </div>
            </div>
            
            <div id="help-feed-list" class="reports-list grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full py-12 text-center text-slate-600 dark:text-slate-400 animate-pulse">
                    <i class="fas fa-spinner fa-spin text-xl mb-3"></i>
                    <p>Loading active help requests...</p>
                </div>
            </div>
        </div>
    </div>
</main>

<nav class="fixed bottom-0 w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 border-t border-slate-200 flex sm:hidden z-50">
    <button class="nav-btn py-4" data-tab="map">
      <i class="fas fa-map-marked-alt text-lg mb-1"></i><span class="text-xs">Map</span>
    </button>
    <button class="nav-btn py-4" data-tab="reports">
      <i class="fas fa-exclamation-triangle text-lg mb-1"></i><span class="text-xs">Reports</span>
    </button>
    <button class="nav-btn py-4" data-tab="alerts">
      <i class="fas fa-bell text-lg mb-1"></i><span class="text-xs">Alerts</span>
    </button>
    <button class="nav-btn py-4" onclick="location.href='chat.html'">
      <i class="fas fa-comments text-lg mb-1"></i><span class="text-xs">Chat</span>
    </button>
    <button class="nav-btn active py-4" data-tab="profile">
      <i class="fas fa-user text-lg mb-1"></i><span class="text-xs">Profile</span>
    </button>
</nav>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/help_feed.js"></script>
</body>
</html>
