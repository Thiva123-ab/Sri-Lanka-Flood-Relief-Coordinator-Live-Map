<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Flood Relief Sri Lanka</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(0,0,0,0.05); }
        .whatsapp-container { height: calc(100vh - 140px); display: flex; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(0,0,0,0.05); background: rgba(255, 255, 255, 0.85); }
        .chat-sidebar { width: 320px; border-right: 1px solid rgba(255,255,255,0.1); background: rgba(248, 250, 252, 0.8); border-right: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.5); position: relative; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        /* Scrollbar */
        .chat-box::-webkit-scrollbar, .chat-list::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-track, .chat-list::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb, .chat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .message-input-area { padding: 15px 20px; background: rgba(255, 255, 255, 0.95); border-top: 1px solid rgba(0,0,0,0.05); display: flex; gap: 10px; }
        .message-input-area input { flex: 1; background: #f1f5f9; border: 1px solid #e2e8f0; padding: 12px 20px; border-radius: 999px; color: #1e293b; outline: none; transition: border-color 0.3s; }
        .message-input-area input:focus { border-color: #3b82f6; }
        .message-input-area button { width: 48px; height: 48px; border-radius: 50%; background: #3b82f6; color: #1e293b; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .message-input-area button:hover { background: #2563eb; transform: scale(1.05); }

        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 20%; color: #64748b; transition: all 0.3s; } html.dark .nav-btn { color: #cbd5e1; }
        .nav-btn:hover, .nav-btn.active { color: #38bdf8; }
        
        @media (max-width: 768px) { .chat-sidebar { width: 80px; } .sidebar-header h3 { display: none; } }
    </style>
<script src="js/theme.js"></script></head>
<body class="relative min-h-screen bg-gradient-to-br from-emerald-50 via-sky-50 to-teal-100 dark:from-indigo-950 dark:via-slate-900 dark:to-indigo-950 pb-20">

<header class="fixed w-full top-0 z-50 bg-white/40 dark:bg-indigo-950/70 dark:backdrop-blur-xl backdrop-blur-md border-b border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="logo flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center">
                <i class="fas fa-water text-slate-900 dark:text-slate-100 text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100 hidden sm:block">Community Chat</h1>
        </div>
        <div class="user-info flex items-center gap-4">
            <span id="user-role" class="px-3 py-1 rounded-full bg-slate-200/50 border border-slate-300 text-xs font-semibold tracking-wider backdrop-blur-md">...</span>
            <button id="theme-toggle" class="p-2 mr-3 rounded-full bg-slate-200 dark:bg-indigo-900/50 text-slate-800 dark:text-yellow-400 hover:bg-slate-300 dark:hover:bg-blue-100 text-blue-600 dark:bg-slate-700 dark:text-slate-300 transition-colors shadow-inner flex items-center justify-center w-10 h-10 border border-slate-300 dark:border-indigo-400/30"><i class="fas fa-moon"></i></button>
            <button id="logout-btn" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-900 dark:text-slate-100 bg-red-500 hover:bg-red-600 transition-colors">Logout</button>
        </div>
    </div>
</header>

<main class="pt-20 px-4 max-w-6xl mx-auto w-full">
    <div class="whatsapp-container animate__animated animate__fadeInUp">
        
        <div class="chat-sidebar">
            <div class="sidebar-header p-5 border-b border-slate-200 flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Contacts</h3>
                <i class="fas fa-search text-slate-700 dark:text-slate-300 dark:text-slate-400"></i>
            </div>
            <div id="chat-list" class="chat-list flex-1 overflow-y-auto">
                <div class="p-6 text-center text-slate-700 dark:text-slate-300 dark:text-slate-400 animate-pulse">Loading contacts...</div>
            </div>
        </div>

        <div class="chat-area">
            <div id="chat-header" class="chat-header p-5 border-b border-slate-200 bg-blue-50 text-blue-500 dark:bg-indigo-900/50 dark:text-slate-400/80 backdrop-blur-md flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 dark:bg-slate-700 dark:text-slate-300 flex items-center justify-center text-slate-700 dark:text-slate-300 dark:text-slate-400">
                    <i class="fas fa-user"></i>
                </div>
                <div class="chat-title flex flex-col">
                    <h3 id="current-chat-name" class="font-bold text-slate-900 dark:text-slate-100">Select a conversation</h3>
                    <span id="chat-status" class="text-xs text-emerald-400" style="display:none;"><i class="fas fa-circle text-[8px] mr-1"></i>Online</span>
                </div>
            </div>

            <div id="chat-box" class="chat-box relative">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-700 dark:text-slate-300 dark:text-slate-400 opacity-50 empty-state">
                    <div class="w-20 h-20 rounded-full bg-blue-50 text-blue-500 dark:bg-indigo-900/50 dark:text-slate-400 flex items-center justify-center text-xl mb-4">
                        <i class="fas fa-comments"></i>
                    </div>
                    <p>Select a contact to start messaging</p>
                </div>
            </div>

            <div class="message-input-area" id="input-area" style="display:none;">
                <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</main>

<nav class="fixed bottom-0 w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-white/60 dark:border-white/10 dark:border-t-white/20 shadow-xl shadow-slate-200/50 dark:shadow-black/50 border-t border-slate-200 flex sm:hidden z-50">
    <button class="nav-btn py-3" onclick="location.href='map.html'">
      <i class="fas fa-map-marked-alt text-lg mb-1"></i><span class="text-xs">Map</span>
    </button>
    <button class="nav-btn py-3" onclick="location.href='report.html'">
      <i class="fas fa-exclamation-triangle text-lg mb-1"></i><span class="text-xs">Reports</span>
    </button>
    <button class="nav-btn py-3" onclick="location.href='alerts.html'">
      <i class="fas fa-bell text-lg mb-1"></i><span class="text-xs">Alerts</span>
    </button>
    <button class="nav-btn active py-3" onclick="location.href='chat.html'">
      <i class="fas fa-comments text-lg mb-1"></i><span class="text-xs">Chat</span>
    </button>
    <button class="nav-btn py-3" onclick="location.href='help.html'">
      <i class="fas fa-user text-lg mb-1"></i><span class="text-xs">Profile</span>
    </button>
</nav>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
