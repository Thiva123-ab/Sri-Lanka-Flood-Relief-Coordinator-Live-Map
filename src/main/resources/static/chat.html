<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Flood Relief Sri Lanka</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
        .whatsapp-container { height: calc(100vh - 140px); display: flex; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.6); }
        .chat-sidebar { width: 320px; border-right: 1px solid rgba(255,255,255,0.1); background: rgba(30, 41, 59, 0.8); display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(15, 23, 42, 0.4); position: relative; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        /* Scrollbar */
        .chat-box::-webkit-scrollbar, .chat-list::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-track, .chat-list::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb, .chat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .message-input-area { padding: 15px 20px; background: rgba(30, 41, 59, 0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        .message-input-area input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 999px; color: white; outline: none; transition: border-color 0.3s; }
        .message-input-area input:focus { border-color: #3b82f6; }
        .message-input-area button { width: 48px; height: 48px; border-radius: 50%; background: #3b82f6; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .message-input-area button:hover { background: #2563eb; transform: scale(1.05); }

        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 20%; color: #94a3b8; transition: all 0.3s; }
        .nav-btn:hover, .nav-btn.active { color: #38bdf8; }
        
        @media (max-width: 768px) { .chat-sidebar { width: 80px; } .sidebar-header h3 { display: none; } }
    </style>
</head>
<body class="relative min-h-screen bg-slate-900 pb-20">

<header class="fixed w-full top-0 z-50 glass-panel border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="logo flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center">
                <i class="fas fa-water text-white text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white hidden sm:block">Community Chat</h1>
        </div>
        <div class="user-info flex items-center gap-4">
            <span id="user-role" class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs font-semibold tracking-wider backdrop-blur-md">...</span>
            <button id="logout-btn" class="px-4 py-1.5 rounded-lg text-sm font-medium text-white bg-red-500 hover:bg-red-600 transition-colors">Logout</button>
        </div>
    </div>
</header>

<main class="pt-20 px-4 max-w-6xl mx-auto w-full">
    <div class="whatsapp-container animate__animated animate__fadeInUp">
        
        <div class="chat-sidebar">
            <div class="sidebar-header p-5 border-b border-white/10 flex items-center justify-between">
                <h3 class="text-lg font-bold text-white">Contacts</h3>
                <i class="fas fa-search text-slate-400"></i>
            </div>
            <div id="chat-list" class="chat-list flex-1 overflow-y-auto">
                <div class="p-6 text-center text-slate-500 animate-pulse">Loading contacts...</div>
            </div>
        </div>

        <div class="chat-area">
            <div id="chat-header" class="chat-header p-5 border-b border-white/10 bg-slate-800/80 backdrop-blur-md flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-slate-400">
                    <i class="fas fa-user"></i>
                </div>
                <div class="chat-title flex flex-col">
                    <h3 id="current-chat-name" class="font-bold text-white">Select a conversation</h3>
                    <span id="chat-status" class="text-xs text-emerald-400" style="display:none;"><i class="fas fa-circle text-[8px] mr-1"></i>Online</span>
                </div>
            </div>

            <div id="chat-box" class="chat-box relative">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 opacity-50 empty-state">
                    <div class="w-20 h-20 rounded-full bg-slate-800 flex items-center justify-center text-4xl mb-4">
                        <i class="fas fa-comments"></i>
                    </div>
                    <p>Select a contact to start messaging</p>
                </div>
            </div>

            <div class="message-input-area" id="input-area" style="display:none;">
                <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</main>

<nav class="fixed bottom-0 w-full glass-panel border-t border-white/10 flex sm:hidden z-50">
    <button class="nav-btn py-3" onclick="location.href='map.html'">
      <i class="fas fa-map-marked-alt text-lg mb-1"></i><span class="text-xs">Map</span>
    </button>
    <button class="nav-btn py-3" onclick="location.href='report.html'">
      <i class="fas fa-exclamation-triangle text-lg mb-1"></i><span class="text-xs">Reports</span>
    </button>
    <button class="nav-btn py-3" onclick="location.href='alerts.html'">
      <i class="fas fa-bell text-lg mb-1"></i><span class="text-xs">Alerts</span>
    </button>
    <button class="nav-btn active py-3" onclick="location.href='chat.html'">
      <i class="fas fa-comments text-lg mb-1"></i><span class="text-xs">Chat</span>
    </button>
    <button class="nav-btn py-3" onclick="location.href='help.html'">
      <i class="fas fa-user text-lg mb-1"></i><span class="text-xs">Profile</span>
    </button>
</nav>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
